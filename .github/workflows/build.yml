name: 🔨 build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v4
      with:
        cache: false
    - name: Install Worker dependencies
      working-directory: cloudflare
      run: npm ci
    - name: Build Go binary
      run: mise run build:go
    # Builds the linux/amd64 container image from the root Dockerfile and bundles the Worker, without deploying.
    - name: Build container image and Worker
      run: mise run build:worker
