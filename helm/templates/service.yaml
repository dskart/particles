apiVersion: v1
kind: Service
metadata:
  name: {{ include "particles.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "particles.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
      name: ssh
  selector:
    {{- include "particles.selectorLabels" . | nindent 4 }}